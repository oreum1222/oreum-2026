<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>찾는 페이지가 없습니다 | [오름] 국어</title>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;700&display=swap" rel="stylesheet"/>
<script src="/analytics.js" defer></script>
<style>
  :root{--bg:#F6FAF7;--ink:#122018;--muted:#4A5E52;--accent:#0D9464;--line:rgba(18,32,24,.18)}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Hahmlet",serif;word-break:keep-all;padding:24px}
  .box{max-width:520px;text-align:center}
  .num{font-size:15px;letter-spacing:.3em;color:var(--accent);margin-bottom:18px;font-weight:700}
  h1{font-size:clamp(26px,5vw,34px);font-weight:700;line-height:1.4;margin-bottom:14px}
  p{color:var(--muted);line-height:1.7;margin-bottom:32px}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-block;padding:13px 22px;border-radius:999px;text-decoration:none;font-weight:700;font-size:15px}
  a.main{background:var(--accent);color:var(--bg)}
  a.sub{border:1px solid var(--line);color:var(--ink)}
  a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main class="box">
  <div class="num">404</div>
  <h1>찾으시는 페이지가<br/>없거나 옮겨졌습니다.</h1>
  <p>주소가 바뀌었거나 지난 안내 페이지일 수 있습니다.<br/>아래에서 지금 내용을 확인해 주세요.</p>
  <div class="row"><a class="btn main" href="/courses.html">강좌 보기</a><a class="btn sub" href="/">처음으로</a><a class="btn sub" href="https://pf.kakao.com/_ksxaCn/chat" target="_blank" rel="noopener">카카오톡 상담</a></div>
</main>
</body>
</html>
