    if(current==='RESULT'){ renderResult(); }

  function renderAsk(id){

          if(current==='RESULT'){ reveal(); } else { busy=false; render(); }

        if(RM){ go(); } else { box.classList.add('leaving'); setTimeout(go,360); }

      opts.appendChild(b);

    box.appendChild(opts);

  }

    var box=el('div','result');
    var words=heading.split(' ').map(function(w,i){return '<span class="w" style="animation-delay:'+(0.15+i*0.08).toFixed(2)+'s">'+w+'</span>';}).join(' ');
    box.appendChild(el('div','rh','<div class="rt">'+(archetype?archetype+'으로 읽힙니다':'이렇게 준비하면 좋습니다')+'</div><h2>'+words+'</h2>'));
    var base=0.15+heading.split(' ').length*0.08+0.1;
    var i=1;
    all.forEach(function(r,idx){
      var c=el('div','rec'+(r.key?' key glow':'')+(r.note?' note':'')+(r.soft?' soft':''));
      c.style.animationDelay=(base+idx*0.14).toFixed(2)+'s';
      var num=r.note?'·':(r.soft?'＋':('0'+(i++)));
      var d=DESC[r.t];
      c.innerHTML='<span class="num">'+num+'</span><div><h3>'+r.t+(r.s?'<small>'+r.s+'</small>':'')+'</h3><p>'+r.p+'</p>'
        +(d?'<button class="expbtn" type="button">이 전형이 뭐예요?</button><div class="exp">'+d+'</div>':'')
        +(r.link?'<a class="explink" href="'+r.link+'" target="_blank" rel="noopener">약술형 논술 알아보기 →</a>':'')
        +'</div>';
      if(r.link){
        var lk=c.querySelector('.explink');
        lk.addEventListener('click',function(){track('jeonhyeong_yaksul_click');});
      }
      if(d){
        var btn=c.querySelector('.expbtn');
        btn.addEventListener('click',function(){
          var on=c.classList.toggle('open');
          btn.textContent=on?'설명 접기':'이 전형이 뭐예요?';
          track('jeonhyeong_desc',{jh:r.t,open:on?1:0});
        });
      }
      box.appendChild(c);
    });
    var tail=base+all.length*0.14+0.15;
    if(combo){
      var cb=el('div','rec soft');
      cb.style.animationDelay=tail.toFixed(2)+'s';
      cb.innerHTML='<span class="num">＋</span><div><h3>수시 6장 조합 예시</h3><p>'+combo+' 실제 장수는 3학년 1학기 내신과 8월 말 모의평가가 나온 뒤 조정합니다.</p></div>';
      box.appendChild(cb); tail+=0.14;
    }
    var wn=el('div','warn','<span class="wi">!</span><span>이 결과는 간단한 질문 몇 개로 <b>큰 방향만 아주 간단하게</b> 짚은 것입니다. 실제 유불리는 대학별 환산, 학생부의 실제 기록, 모의고사 추이에 따라 완전히 달라질 수 있으니, 이 결과를 그대로 믿지 말고 <b>반드시 선생님, 입시 전문가와의 상담으로 확인</b>하세요.</span>');
    wn.style.animationDelay=tail.toFixed(2)+'s'; box.appendChild(wn); tail+=0.14;
    var qt=el('p','quote','‘내신이냐 수능이냐’가 아니라, 어느 전형에서 내 성적이 가장 높게 계산되느냐를 묻는 겨울입니다.');
    qt.style.animationDelay=tail.toFixed(2)+'s'; box.appendChild(qt); tail+=0.12;
    var cl=el('p','closing','전형이 정해지면, 겨울 공부가 정해집니다.'); cl.style.animationDelay=tail.toFixed(2)+'s'; box.appendChild(cl);
    var cta=el('div','cta'); cta.style.animationDelay=(tail+0.12).toFixed(2)+'s';
    cta.innerHTML='<a class="p" id="rk" href="'+KAKAO+'" target="_blank" rel="noopener">상담으로 확인하기</a><a class="s" href="winter.html">예비 고3 겨울 강좌 보기</a>';
    box.appendChild(cta);
    var rs=el('button','restart','처음부터 다시 하기'); rs.style.animationDelay=(tail+0.24).toFixed(2)+'s';
    rs.addEventListener('click',function(){ answers={}; path=[]; current='axis'; busy=false; render(); });
    box.appendChild(rs);
    flow.appendChild(box);
    var rk=document.getElementById('rk'); if(rk) rk.addEventListener('click',function(){track('jeonhyeong_kakao_click');});
  }

  // 검수용: ?go=naesin,g1,yes,yes,no 처럼 답을 미리 채워 결과 화면으로 간다.
  (function(){
    var m=location.search.match(/[?&]go=([a-z0-9,]+)/);
    if(!m) return;
    m[1].split(',').forEach(function(v){
      if(current==='RESULT') return;
      var qq=Q[current]; if(!qq) return;
      var opt=qq.opts.filter(function(o){return o.val===v;})[0];
      if(!opt) return;
      answers[current]=v; path.push(current); current=opt.next;
    });
  })();

  function start(){ track('jeonhyeong_open'); render(); }
  function boot(){
    if(RM){ var it=document.getElementById('intro'); if(it) it.style.display='none'; start(); }
    else{
      start();
      setTimeout(function(){ var it=document.getElementById('intro'); if(it&&it.parentNode) it.parentNode.removeChild(it); }, 2650);
    }
  }
  if(document.readyState!=='loading'){ boot(); }
  else{ document.addEventListener('DOMContentLoaded', boot); }
})();
</script>
</body>
</html>
