<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>우리 아이에게 필요한 겨울 강의 찾기 | [오름] 국어</title>
<meta name="description" content="예비 고1부터 고3까지, 간단한 질문을 하나씩 따라 내려오면 우리 아이에게 필요한 겨울 국어 강의가 나옵니다."/>
<meta property="og:title" content="우리 아이에게 필요한 겨울 강의 찾기 | [오름] 국어"/>
<meta property="og:description" content="간단한 질문을 따라 내려오면 우리 아이에게 필요한 겨울 국어 강의가 나옵니다."/>
<meta property="og:image" content="https://class.oreumyak.com/og-image-v2.png"/>
<link rel="icon" href="favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Hahmlet:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{ --bg:#f6faf7; --ink:#152a1e; --muted:#6b8073; --green:#0d9464; --green-soft:rgba(13,148,100,.1);
         --line:rgba(13,148,100,.22); --card:#ffffff; --deep:#123524; --p:0; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6;overflow-x:clip;}
  a{color:inherit;}
  /* 내려갈수록 깊어지는 배경 */
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none;
     background:
       radial-gradient(130% 90% at 50% calc(-20% + var(--p)*70%), rgba(13,148,100,calc(.07 + var(--p)*.1)), rgba(13,148,100,0) 55%),
       linear-gradient(180deg, rgba(18,53,36,0) 30%, rgba(18,53,36,calc(var(--p)*.14)) 100%),
       var(--bg);
     transition:background 1.1s ease;}
  .wrap{position:relative;z-index:1;width:100%;max-width:600px;margin:0 auto;padding:0 22px;}
  .serif{font-family:'Hahmlet','Noto Serif KR',serif;}
  /* 상단 바 */
  .top{position:sticky;top:0;z-index:20;background:rgba(246,250,247,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:860px;}
  .logo{font-family:'Hahmlet',serif;font-weight:700;letter-spacing:-.02em;font-size:19px;text-decoration:none;}
  .logo em{font-style:normal;color:var(--green);}
  .back{text-decoration:none;font-size:14px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:9px 15px;background:#fff;transition:border-color .2s,color .2s;}
  .back:hover{border-color:var(--green);color:var(--ink);}
  /* 히어로 */
  .hero{padding:48px 0 4px;text-align:center;}
  .eyebrow{display:inline-flex;align-items:baseline;gap:7px;font-size:13.5px;font-weight:700;color:var(--green);letter-spacing:.04em;}
  .eyebrow::before{content:'[';font-family:'Hahmlet',serif;}
  .eyebrow::after{content:']';font-family:'Hahmlet',serif;}
  h1{font-family:'Hahmlet',serif;font-size:clamp(27px,5vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.22;margin:18px 0 0;word-break:keep-all;}
  .hero .sub{font-size:15.5px;color:#4a5e52;margin:14px auto 0;max-width:430px;line-height:1.7;word-break:keep-all;text-wrap:pretty;}
  .nb{display:inline-block;white-space:nowrap;}
  /* 무대: 척추선 + 흐름 */
  #stage{position:relative;padding:26px 0 10px;}
  #spine{position:absolute;left:11px;top:34px;bottom:30px;width:2px;background:rgba(13,148,100,.12);overflow:hidden;}
  #spineFill{position:absolute;left:0;top:0;width:100%;height:100%;transform:scaleY(var(--p));transform-origin:top;
     background:linear-gradient(180deg,rgba(13,148,100,0),rgba(13,148,100,.85));transition:transform .7s cubic-bezier(.22,1,.36,1);}
  #flow{position:relative;}
  /* 지나온 질문: 매듭으로 가라앉음 */
  .rung{position:relative;display:flex;align-items:center;gap:12px;padding:12px 16px 12px 38px;margin-bottom:9px;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;opacity:.6;transition:opacity .35s,border-color .2s;}
  .rung:hover{opacity:1;border-color:var(--green);}
  .rung::before{content:"";position:absolute;left:4px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--bg);}
  .rung .rq{font-size:12.5px;color:var(--muted);flex:1;min-width:0;word-break:keep-all;}
  .rung .ra{font-size:14px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;}
  .rung .redo{font-size:11px;color:#9bb0a3;white-space:nowrap;}
  /* 현재 질문: 솟아오름 */
  .ask{position:relative;margin-left:24px;background:#fff;border:1px solid rgba(13,148,100,.35);border-radius:18px;padding:26px 22px;box-shadow:0 36px 90px rgba(13,60,40,.14);}
  .ask::before{content:"";position:absolute;left:-18px;top:30px;width:16px;height:16px;border-radius:50%;background:var(--green);box-shadow:0 0 18px 2px rgba(13,148,100,.45),0 0 0 4px var(--bg);}
  .ask.enter{animation:askin .55s cubic-bezier(.22,1,.36,1) both;}
  @keyframes askin{from{opacity:0;transform:translateY(30px) scale(.985);}to{opacity:1;transform:none;}}
  .ask.leaving{animation:askout .36s ease forwards;}
  @keyframes askout{to{opacity:0;transform:translateY(-8px);}}
  .ask .qn{font-family:'Hahmlet',serif;font-size:12.5px;font-weight:700;color:var(--green);letter-spacing:.06em;}
  .ask h2{font-family:'Hahmlet',serif;font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.45;margin:9px 0 2px;word-break:keep-all;text-wrap:pretty;}
  .ask .hint{font-size:13.5px;color:var(--muted);margin:6px 0 0;line-height:1.6;word-break:keep-all;text-wrap:pretty;}
  .opts{display:flex;flex-direction:column;gap:9px;margin-top:18px;}
  .opt{text-align:left;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:15px 16px;color:var(--ink);font-size:15.5px;font-weight:700;letter-spacing:-.01em;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:border-color .18s,background .18s,transform .12s,opacity .3s;}
  .opt:hover{border-color:var(--green);background:var(--green-soft);}
  .opt:active{transform:scale(.99);}
  .opt .od{font-size:12.5px;font-weight:500;color:var(--muted);}
  .opt .ar{color:#9bb0a3;font-size:17px;}
  .opt:hover .ar{color:var(--green);}
  .opt.chosen{border-color:var(--green);background:var(--green-soft);}
  .opts.collapsing .opt:not(.chosen){opacity:0;transform:translateY(-4px);}
  /* 결과 전 암전 */
  #veil{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(10,30,20,.9);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s;}
  #veil.on{opacity:1;visibility:visible;}
  #veil .vt{font-family:'Hahmlet',serif;font-size:15.5px;color:#e8f3ec;letter-spacing:.02em;}
  #veil .dots span{display:inline-block;animation:bd 1.1s infinite;}
  #veil .dots span:nth-child(2){animation-delay:.18s;} #veil .dots span:nth-child(3){animation-delay:.36s;}
  @keyframes bd{0%,60%,100%{opacity:.25;}30%{opacity:1;}}
  /* 결과 */
  .result .rh{text-align:center;margin:6px 0 20px;}
  .result .rh .rt{font-family:'Hahmlet',serif;font-size:12.5px;font-weight:700;color:var(--green);letter-spacing:.06em;}
  .result .rh h2{font-family:'Hahmlet',serif;font-size:24px;font-weight:700;letter-spacing:-.015em;margin:10px 0 0;word-break:keep-all;}
  .result .rh h2 .w{display:inline-block;opacity:0;transform:translateY(12px);animation:wordin .5s cubic-bezier(.22,1,.36,1) forwards;}
  @keyframes wordin{to{opacity:1;transform:none;}}
  .rec{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px;margin-bottom:11px;opacity:0;transform:translateY(16px);animation:recin .5s cubic-bezier(.22,1,.36,1) forwards;}
  @keyframes recin{to{opacity:1;transform:none;}}
  .rec.key{background:linear-gradient(170deg,var(--deep),#0c2418);color:#f2f8f3;border-color:transparent;}
  .rec.key.glow{animation:recin .5s cubic-bezier(.22,1,.36,1) forwards, keyglow 2.4s ease .5s 1;}
  @keyframes keyglow{0%{box-shadow:0 0 0 0 rgba(13,148,100,0);}25%{box-shadow:0 0 44px 4px rgba(13,148,100,.5);}100%{box-shadow:0 0 0 0 rgba(13,148,100,0);}}
  .rec .num{font-family:'Hahmlet',serif;font-size:13px;font-weight:700;flex:0 0 auto;margin-top:2px;color:var(--muted);}
  .rec.key .num{color:#7deeb2;}
  .rec h3{font-family:'Hahmlet',serif;font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0;}
  .rec p{font-size:13.5px;line-height:1.65;margin:5px 0 0;color:#4a5e52;word-break:keep-all;text-wrap:pretty;}
  .rec.key p{color:#b9cfc0;}
  .rec.note{background:none;border:1px dashed rgba(13,148,100,.4);}
  .rec.note h3{color:#3f5a4b;}
  .rec.soft{background:linear-gradient(180deg,var(--green-soft),var(--card));border:1px solid rgba(13,148,100,.4);}
  .rec.soft .num{color:var(--green);font-weight:700;}
  .callout{background:var(--green-soft);border:1px solid rgba(13,148,100,.45);border-radius:12px;padding:13px 16px;margin:-4px 0 16px;font-family:'Noto Sans KR',sans-serif;font-size:14.5px;font-weight:700;color:#1d4634;text-align:center;line-height:1.6;word-break:keep-all;text-wrap:pretty;opacity:0;animation:recin .5s ease forwards;}
  .callout b{color:var(--green);}
  .fee{font-size:12.5px;color:#4a5e52;text-align:center;margin:4px 0 2px;line-height:1.7;word-break:keep-all;text-wrap:pretty;opacity:0;animation:recin .5s ease forwards;}
  .closing{font-family:'Hahmlet',serif;text-align:center;font-size:15.5px;color:#1d4634;font-weight:600;margin:22px 0 2px;opacity:0;animation:recin .6s ease forwards;word-break:keep-all;}
  .cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 12px;opacity:0;animation:recin .6s ease forwards;}
  .cta a{text-decoration:none;font-size:14.5px;font-weight:700;border-radius:12px;padding:13px 22px;transition:opacity .2s,border-color .2s,background .2s;}
  .cta .p{background:var(--green);color:#fff;}
  .cta .p:hover{opacity:.9;}
  .cta .s{border:1px solid var(--line);color:var(--ink);background:#fff;}
  .cta .s:hover{border-color:var(--green);background:var(--green-soft);}
  .restart{display:block;margin:4px auto 0;background:none;border:0;color:#9bb0a3;font-size:13px;cursor:pointer;font-family:inherit;padding:8px;opacity:0;animation:recin .6s ease forwards;}
  .restart:hover{color:var(--muted);}
  .mini{position:relative;z-index:1;font-size:12px;color:#8a9c90;margin:18px auto 80px;text-align:center;line-height:1.7;word-break:keep-all;text-wrap:pretty;max-width:460px;}
  footer{position:relative;z-index:1;border-top:1px solid var(--line);background:rgba(255,255,255,.5);}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:28px 22px;color:var(--muted);font-size:13px;max-width:860px;}
  /* 인트로 한 줄 */
  #intro{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px;text-align:center;}
  #intro p{font-family:'Hahmlet',serif;font-size:clamp(21px,5vw,31px);font-weight:700;letter-spacing:-.02em;color:var(--deep);opacity:0;animation:introseq 2.6s ease forwards;word-break:keep-all;}
  @keyframes introseq{0%{opacity:0;transform:translateY(10px);}22%{opacity:1;transform:none;}72%{opacity:1;transform:translateY(-4px);}100%{opacity:0;transform:translateY(-10px);}}
  /* 모바일 */
  @media(max-width:420px){
    .wrap{padding:0 16px;}
    .top .wrap{height:58px;}
    .hero{padding:38px 0 2px;}
    #stage{padding:22px 0 10px;}
    #spine{left:8px;}
    .rung{padding:11px 13px 11px 34px;}
    .rung::before{left:3px;width:15px;height:15px;margin-top:-7.5px;}
    .ask{margin-left:18px;padding:22px 18px;border-radius:16px;box-shadow:0 24px 60px rgba(13,60,40,.14);}
    .ask::before{left:-14px;}
    .ask h2{font-size:19.5px;}
    .opt{font-size:15px;padding:14px 15px;}
    .result .rh h2{font-size:22px;}
    .cta a{flex:1;text-align:center;padding:13px 12px;}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
    #intro{display:none;}
    .rec,.result .rh h2 .w,.closing,.cta,.restart,.callout,.fee{opacity:1;transform:none;}
  }
</style>
<script src="analytics.js" defer></script>
</head>
<body>
<div id="bg"></div>
<header class="top"><div class="wrap">
  <a class="logo" href="index.html"><em>[오름]</em> 국어</a>
  <a class="back" href="index.html">← 홈으로</a>
</div></header>

<main class="wrap">
  <section class="hero">
    <span class="eyebrow">예비 고1부터 고3까지 겨울 안내</span>
    <h1><span class="nb">우리 아이에게 필요한</span> <span class="nb">겨울 강의 찾기</span></h1>
    <p class="sub">간단한 질문을 하나씩 따라 내려오시면, 겨울에 무엇을 준비하면 좋을지 나옵니다.</p>
  </section>
  <div id="stage">
    <div id="spine"><div id="spineFill"></div></div>
    <div id="flow"></div>
  </div>
  <p class="mini">큰 방향을 잡기 위한 안내입니다. 아이의 학교와 성적, 학습 이력에 따라 결과가 달라질 수 있으니 마지막은 상담으로 확인해 주세요.</p>
</main>

<footer><div class="wrap">
  <span>[오름] 국어</span>
  <a href="http://pf.kakao.com/_ksxaCn/chat" target="_blank" rel="noopener" style="text-decoration:none;color:#3f5a4b;">카카오톡 문의 →</a>
</div></footer>

<div id="veil"><div style="text-align:center"><div class="vt">우리 아이의 겨울을 짚어보는 중<span class="dots"><span>.</span><span>.</span><span>.</span></span></div></div></div>
<div id="intro"><p>이번 겨울은 달라야 합니다.</p></div>

<script>
(function(){
  var KAKAO='http://pf.kakao.com/_ksxaCn/chat';
  var RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  function track(n,p){ if(window.gtag){ window.gtag('event',n,p||{}); } }

  // 질문 정의 — 학년별 분기
  var Q={
    grade:{ n:'질문 1', q:'자녀가 어느 학년인가요?', hint:'겨울 기준으로 올라갈 학년을 골라 주세요.', short:'학년',
      opts:[
        {label:'예비 고1', d:'(현재 중3)', val:'g1', a:'예비 고1', next:'g1_gaenyeom'},
        {label:'예비 고2', d:'(현재 고1)', val:'g2', a:'예비 고2', next:'g2_gaenyeom'},
        {label:'예비 고3', d:'(현재 고2)', val:'g3', a:'예비 고3', next:'g3_grammar'}
      ]},
    g1_gaenyeom:{ n:'질문 2', q:'문학개념어가 준비돼 있나요?', hint:'고등부 학습 과정을 경험한 적 있는지, 있다면 ‘문학 개념어’를 전체적으로 짚어본 적이 있는지를 꼭 확인해 보세요.', short:'문학개념어',
      opts:[
        {label:'네, 준비돼 있어요', val:'yes', a:'준비됨', next:'g1_grammar'},
        {label:'아니요, 아직이에요', val:'no', a:'아직', next:'g1_grammar'}
      ]},
    g1_grammar:{ n:'마지막 질문', q:'현대문법이 대비돼 있나요?', hint:'중학교 수준이 아닌 단어편, 음운편, 문장편을 전반적으로 정리한 적이 있는지 꼭 확인해 보세요.', short:'현대문법',
      opts:[
        {label:'네, 대비돼 있어요', val:'yes', a:'대비됨', next:'RESULT'},
        {label:'아니요, 아직이에요', val:'no', a:'아직', next:'RESULT'}
      ]},
    g2_gaenyeom:{ n:'질문 2', q:'문학개념어를 끝까지 들어, 개념이 정리돼 있나요?', hint:'1학기 내신이 문학이라, 개념어가 출발점입니다.', short:'문학개념어',
      opts:[
        {label:'네, 정리돼 있어요', val:'yes', a:'정리됨', next:'g2_dir'},
        {label:'아니요, 아직이에요', val:'no', a:'아직', next:'g2_dir'}
      ]},
    g2_dir:{ n:'질문 3', q:'겨울 공부의 무게를 어디에 두시겠어요?', hint:'심화 과목의 방향이 달라집니다.', short:'겨울 방향',
      opts:[
        {label:'내신에 집중할래요', val:'naesin', a:'내신 집중', next:'RESULT'},
        {label:'수능 비중을 늘릴래요', val:'suneung', a:'수능 비중 확대', next:'RESULT'}
      ]},
    g3_grammar:{ n:'마지막 질문', q:'현대문법(화법과 언어)이 정리돼 있나요?', hint:'2학년 2학기에 ‘화법과 언어’를 배워 큰 틀이 잡혔는지로 보시면 됩니다.', short:'현대문법',
      opts:[
        {label:'네, 정리돼 있어요', d:'(군포중앙고2, 수리고2, 흥진고2 재학생이에요)', val:'yes', a:'정리됨', next:'RESULT'},
        {label:'아직이에요', d:'(산본고2, 군포고2, 용호고2 재학생이에요)', val:'no', a:'아직', next:'RESULT'}
      ]}
  };

  var flow=document.getElementById('flow');
  var answers={}, path=[], current='grade', busy=false;
  function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
  var CHK='<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:6px;top:50%;margin-top:-6px"><path d="M20 6 9 17l-5-5"/></svg>';

  function progress(){
    var depth = current==='RESULT' ? 1 : (path.length/4);
    document.documentElement.style.setProperty('--p', depth.toFixed(3));
  }

  function render(){
    flow.innerHTML='';
    path.forEach(function(id){
      var qq=Q[id], ans=answers[id];
      var opt=qq.opts.filter(function(o){return o.val===ans;})[0];
      var rung=el('div','rung');
      rung.innerHTML=CHK+'<span class="rq">'+qq.short+'</span><span class="ra">'+(opt?opt.a:'')+'</span><span class="redo">수정</span>';
      rung.addEventListener('click',function(){
        if(busy)return;
        var i=path.indexOf(id);
        path=path.slice(0,i);
        var keep={}; path.forEach(function(p){keep[p]=answers[p];}); answers=keep;
        current=id; render();
      });
      flow.appendChild(rung);
    });
    if(current==='RESULT'){ renderResult(); }
    else{ renderAsk(current); }
    progress();
    var last=flow.lastChild;
    if(last&&last.scrollIntoView){ try{ last.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'}); }catch(e){} }
  }

  function renderAsk(id){
    var qq=Q[id];
    var box=el('div','ask enter');
    box.innerHTML='<div class="qn">'+qq.n+'</div><h2>'+qq.q+'</h2>'+(qq.hint?'<p class="hint">'+qq.hint+'</p>':'');
    var opts=el('div','opts');
    qq.opts.forEach(function(o){
      var b=el('button','opt');
      b.innerHTML='<span>'+o.label+(o.d?' <span class="od">'+o.d+'</span>':'')+'</span><span class="ar">→</span>';
      b.addEventListener('click',function(){
        if(busy)return; busy=true;
        b.classList.add('chosen'); opts.classList.add('collapsing');
        var go=function(){
          answers[id]=o.val;
          if(path.indexOf(id)<0) path.push(id);
          current=o.next;
          if(current==='RESULT'){ reveal(); } else { busy=false; render(); }
        };
        if(RM){ go(); } else { box.classList.add('leaving'); setTimeout(go,360); }
      });
      opts.appendChild(b);
    });
    box.appendChild(opts);
    flow.appendChild(box);
  }

  function reveal(){
    progress();
    var veil=document.getElementById('veil');
    if(RM){ render(); busy=false; return; }
    veil.classList.add('on');
    setTimeout(function(){
      render();
      veil.classList.remove('on');
      busy=false;
      try{ flow.lastChild.scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){}
    },760);
  }

  function renderResult(){
    track('finder_result',{grade:answers.grade||'',a1:answers.g1_gaenyeom||answers.g2_gaenyeom||'',a2:answers.g1_grammar||answers.g2_dir||'',a3:answers.g3_grammar||''});
    var recs=[], notes=[];
    var g=answers.grade;

    if(g==='g1'){
      // 포인트: 문학개념어 + 현대문법이 돼야 고등부 대비. 둘 다 되면 독해기초로 비문학 대비.
      var gaOk=(answers.g1_gaenyeom==='yes'), grOk=(answers.g1_grammar==='yes');
      if(!grOk) recs.push({key:true,t:'[통합] 현대문법',p:'품사부터 음운까지, 고등 문법의 큰 틀을 겨울에 세워 둡니다. 고1 내신 문법은 이 체계가 없으면 암기로 버티기 어렵습니다.'});
      if(!gaOk) recs.push({key:grOk,t:'[통합] 문학개념어',p:'고등 문학은 개념어로 묻고 개념어로 답합니다. 고1 내신과 모의고사를 받치는 첫 기둥이라, 겨울에 반드시 잡아 두어야 합니다.'});
      if(gaOk&&grOk){
        recs.push({key:true,t:'[통합] 독해기초',p:'문학개념어도 문법도 준비돼 있으니, 겨울에는 독해 기초로 수능 국어 비문학 영역을 대비합니다. 읽는 힘은 고등 3년 국어 전체의 바탕이 됩니다.'});
        notes.push({note:true,t:'문학개념어와 현대문법은 이미 준비돼 있습니다',p:'고등부를 준비하며 꼭 필요한 두 과목이 준비돼 있다니, 아주 탄탄한 기본기를 가졌네요. 다만 이 두 영역은 내신에서 매우 중요하게 작용하니, 그 중요도를 고려해 이번 방학에 다시 한번 학습해 보는 것도 고려해 보세요.'});
      }else{
        if(gaOk) notes.push({note:true,t:'문학개념어는 준비돼 있습니다',p:'남은 한 과목만 채우면 고등부 대비가 완성됩니다.'});
        if(grOk) notes.push({note:true,t:'현대문법은 대비돼 있습니다',p:'남은 한 과목만 채우면 고등부 대비가 완성됩니다.'});
      }
    }

    if(g==='g2'){
      var gaNeed=(answers.g2_gaenyeom==='no');
      var sun=(answers.g2_dir==='suneung');
      // 심화: 내신 집중=고전문학, 수능 비중=[고2] 수능반
      var simhwa = sun ? {t:'[고2] 수능반',p:'수능 문학을 실제로 풀며, 모의고사와 수능을 함께 준비합니다. 수능 비중을 늘리기로 했다면 겨울 공부의 기본 축입니다.'}
                       : {t:'[고2] 고전문학',p:'1학기 문학 내신에서 가장 까다로운 고전문학을 겨울에 미리 끝내 둡니다. 내신에 특화된 심화 과목입니다.'};
      if(gaNeed){
        recs.push({key:true,t:'[고2] 문학개념어',p:'1학기 내신이 문학입니다. 개념어가 안 돼 있으면 심화도 내신도 헛돕니다. 겨울의 1순위입니다.'});
        simhwa.p='개념어를 다지면서 2순위로 함께 가져가면 좋습니다. '+simhwa.p;
        recs.push(simhwa);
      }else{
        simhwa.key=true;
        recs.push(simhwa);
        notes.push({note:true,t:'문학개념어는 다시 들을 필요가 없습니다',p:'개념어가 이미 정리돼 있어, 바로 심화로 갑니다.'});
      }
    }

    if(g==='g3'){
      recs.push({key:true,t:'[고3] 수능정규반',p:'예비 고3의 겨울은 수능으로 직행합니다. 기출과 모의고사를 축으로 수능 국어 전 영역의 틀을 세우는 정규 과정입니다. 금요일 저녁 7시 시작과 토요일 아침 9시 시작 중 한 반을 선택합니다.'});
      if(answers.g3_grammar==='no'){
        recs.push({t:'[고3] 현대문법',p:'산본고, 군포고, 용호고는 3학년 1학기 내신이 문법 중심의 ‘화법과 언어’입니다. 내신에도 수능에도 문법이 필수라, 겨울에 큰 틀을 끝내 두어야 합니다.'});
      }else{
        notes.push({note:true,t:'문법 수업은 필요하지 않습니다',p:'2학년 2학기에 이미 정리를 끝냈으니, 겨울은 수능 정규반에만 집중하면 됩니다.'});
      }
    }

    // 두 강좌까지는 수강료가 같다: 1순위와 2순위는 추천, 3순위부터는 고려로 돌린다.
    var strongCount=0;
    recs.forEach(function(r){
      if(r.soft) return;
      strongCount++;
      if(strongCount>2){ r.soft=true; r.key=false; r.p='여유가 되신다면 함께 고려해 보세요. '+r.p; }
    });
    var all=recs.concat(notes);
    var hasStrong=recs.some(function(r){return !r.soft;});
    var heading = hasStrong ? '우리 아이 겨울, 이 강의를 추천합니다' : '지금 꼭 필요한 겨울 강의는 뚜렷하지 않습니다';

    var box=el('div','result');
    var words=heading.split(' ').map(function(w,i){return '<span class="w" style="animation-delay:'+(0.15+i*0.08).toFixed(2)+'s">'+w+'</span>';}).join(' ');
    box.appendChild(el('div','rh','<div class="rt">이렇게 준비하면 좋습니다</div><h2>'+words+'</h2>'));
    var base=0.15+heading.split(' ').length*0.08+0.1;
    if(g==='g1' && answers.g1_gaenyeom==='no' && answers.g1_grammar==='no'){
      var co=el('div','callout','고등부 국어를 위해 둘 다 필요하지만, 딱 하나만 들어야 한다면 <b>현대문법</b>을 우선적으로 권장합니다.');
      co.style.animationDelay=base.toFixed(2)+'s';
      box.appendChild(co);
      base+=0.14;
    }
    var i=1;
    all.forEach(function(r,idx){
      var c=el('div','rec'+(r.key?' key glow':'')+(r.note?' note':'')+(r.soft?' soft':''));
      c.style.animationDelay=(base+idx*0.14).toFixed(2)+'s';
      var num=r.note?'·':(r.soft?'＋':('0'+(i++)));
      c.innerHTML='<span class="num">'+num+'</span><div><h3>'+r.t+'</h3><p>'+r.p+'</p></div>';
      box.appendChild(c);
    });
    var tail=base+all.length*0.14+0.15;
    if(recs.length>1){
      var fe=el('p','fee','두 강좌까지는 수강료가 동일합니다. 1순위와 2순위를 중심으로 잡고, ＋ 표시는 여유에 따라 고려해 보세요.');
      fe.style.animationDelay=tail.toFixed(2)+'s';
      box.appendChild(fe);
      tail+=0.12;
    }
    var cl=el('p','closing','우리 아이의 겨울은, 지금 정해집니다.'); cl.style.animationDelay=tail.toFixed(2)+'s'; box.appendChild(cl);
    var cta=el('div','cta'); cta.style.animationDelay=(tail+0.12).toFixed(2)+'s';
    cta.innerHTML='<a class="p" id="rk" href="'+KAKAO+'" target="_blank" rel="noopener">상담으로 확인하기</a><a class="s" href="winter.html">겨울 강좌 보기</a>';
    box.appendChild(cta);
    var rs=el('button','restart','처음부터 다시 하기'); rs.style.animationDelay=(tail+0.24).toFixed(2)+'s';
    rs.addEventListener('click',function(){ answers={}; path=[]; current='grade'; busy=false; render(); });
    box.appendChild(rs);
    flow.appendChild(box);
    var rk=document.getElementById('rk'); if(rk) rk.addEventListener('click',function(){track('finder_kakao_click');});
  }

  // 검수용: ?go=g2,no,suneung 처럼 답을 미리 채워 결과 화면으로 간다.
  (function(){
    var m=location.search.match(/[?&]go=([a-z0-9,]+)/);
    if(!m) return;
    m[1].split(',').forEach(function(v){
      if(current==='RESULT') return;
      var qq=Q[current]; if(!qq) return;
      var opt=qq.opts.filter(function(o){return o.val===v;})[0];
      if(!opt) return;
      answers[current]=v; path.push(current); current=opt.next;
    });
  })();

  function start(){ track('finder_open'); render(); }
  function boot(){
    if(RM){ var it=document.getElementById('intro'); if(it) it.style.display='none'; start(); }
    else{
      start();
      setTimeout(function(){ var it=document.getElementById('intro'); if(it&&it.parentNode) it.parentNode.removeChild(it); }, 2650);
    }
  }
  if(document.readyState!=='loading'){ boot(); }
  else{ document.addEventListener('DOMContentLoaded', boot); }
})();
</script>
</body>
</html>
